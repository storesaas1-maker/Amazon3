<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>إعداد المدير العام</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="container section">
      <section class="panel" style="max-width: 520px; margin: auto">
        <h1>إعداد المدير العام</h1>
        <p>هذه الصفحة مخصصة لإنشاء أول مدير عام للمتجر فقط.</p>
        <form id="setup-form" class="form-grid">
          <label>الاسم<input class="input" name="name" required /></label
          ><label
            >البريد الإلكتروني<input
              class="input"
              type="email"
              name="email"
              required /></label
          ><label
            >كلمة المرور<input
              class="input"
              type="password"
              name="password"
              minlength="8"
              required /></label
          ><button class="button">إنشاء حساب المدير العام</button>
        </form>
        <div id="existing-super-admin" hidden>
          <p class="notice">يوجد مدير عام بالفعل. لا يمكن إنشاء حساب آخر.</p>
          <a class="button" href="/login.html">تسجيل الدخول</a>
        </div>
      </section>
    </main>
    <script type="module" src="/js/pages/super-admin-setup.page.js"></script>
  </body>
</html>
