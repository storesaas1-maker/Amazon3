<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>تسجيل الدخول — متجري</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <a class="auth-brand-header" href="/index.html" id="auth-logo">
        <i class="fa-solid fa-bag-shopping" style="color: #FF9900;"></i>
        <span data-store-name>متجري</span>
        <span class="tld">.com</span>
      </a>

      <div class="auth-card" id="login-card">
        <h2>تسجيل الدخول</h2>
        <p class="auth-subtitle">أدخل بيانات حسابك للمتابعة وإدارة طلباتك</p>
        <form id="login-form">
          <div class="field">
            <label for="login-email">البريد الإلكتروني</label>
            <input class="input" id="login-email" type="email" name="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="login-password">كلمة المرور</label>
            <input class="input" id="login-password" type="password" name="password" minlength="8" required autocomplete="current-password" />
          </div>
          <button class="auth-submit" id="login-submit-btn" type="submit">دخول الحساب</button>
        </form>
        <p class="auth-disclaimer">
          بمتابعتك لتسجيل الدخول، فإنك توافق على <a href="#">شروط الاستخدام</a> و <a href="#">إشعار الخصوصية</a> الخاص بمتجري.
        </p>
      </div>

      <div class="auth-switch-divider">
        <span>جديد في متجري؟</span>
      </div>

      <a href="/register.html" class="auth-secondary-btn" id="create-account-link">
        إنشاء حسابك في متجري
      </a>

      <div class="auth-footer">
        <p>© متجري — منصة تجارة إلكترونية معتمدة</p>
      </div>
    </div>
    <script type="module" src="/js/pages/login.page.js"></script>
  </body>
</html>
